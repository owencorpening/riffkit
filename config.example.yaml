# riftkit Configuration Example
# Copy to config.yaml and customize for your setup

paths:
  reaper_projects: "~/music/projects"
  templates: "~/.config/riftkit/templates"
  personal_library: "~/music/riffkit-library"

demucs:
  model: "htdemucs"  # htdemucs (4-stem), htdemucs_ft (fine-tuned), htdemucs_6s (6-stem)
  output_format: "wav"
  
whisper:
  model: "medium"  # small, medium, large
  language: "en"
  
reaper:
  default_tempo: 120
  time_signature: "4/4"
  auto_open: true
